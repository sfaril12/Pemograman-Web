<!DOCTYPE html>
<html>
<head>
    <title>Input Nilai Mahasiswa</title>
</head>
<body>

    <h2>Input Nilai Mahasiswa</h2>

    <label>Nama:</label>
    <input type="text" id="nama">
    <br><br>

    <label>Nilai Tugas:</label>
    <input type="number" id="tugas">
    <br><br>

    <label>Nilai UTS:</label>
    <input type="number" id="uts">
    <br><br>

    <label>Nilai UAS:</label>
    <input type="number" id="uas">
    <br><br>

    <button onclick="hitungNilai()">Hitung</button>

    <h3>Hasil</h3>

    <p>Nama: <span id="hasilNama"></span></p>
    <p>Rata-rata: <span id="hasilRata"></span></p>


    <script>
        function hitungNilai() {

            let nama = document.getElementById("nama").value;
            let tugas = Number(document.getElementById("tugas").value);
            let uts = Number(document.getElementById("uts").value);
            let uas = Number(document.getElementById("uas").value);

            let rataRata = (tugas + uts + uas) / 3;

            document.getElementById("hasilNama").innerHTML = nama;
            document.getElementById("hasilRata").innerHTML = rataRata;
        }
    </script>

</body>
</html>
